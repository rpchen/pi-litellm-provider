name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Allows maintainers/automation to explicitly run the verified release for an existing tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Release closure verification derives archived requirement chronology
          # from Git ancestry and therefore requires complete repository history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(node --print 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata consistency
        run: npm run test:release-metadata

      - name: Reject completed active OpenSpec changes
        run: npm run test:openspec-closure

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun test

      - name: Validate OpenSpec
        run: npm run validate:spec

      - name: Enforce 100% specification scenario coverage
        run: npm run test:scenario-coverage

      - name: Test package without lifecycle scripts
        run: bun run test:package

      - name: Install real Pi host
        run: npm install --global @earendil-works/pi-coding-agent@0.87.1

      - name: Verify real host version
        run: pi --version

      - name: Run real host E2E against tagged Git package
        env:
          E2E_PI_VERSION: "0.87.1"
          E2E_PACKAGE_SPEC: git:github.com/${{ github.repository }}@${{ github.ref_name }}
        run: npm run test:e2e:pi

      - name: Test tagged Git package
        shell: bash
        env:
          PACKAGE_SPEC: github:${{ github.repository }}#${{ github.ref_name }}
        run: |
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          cd "$consumer"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false "$PACKAGE_SPEC"
          node --input-type=module --eval '
            import { existsSync, readFileSync } from "node:fs"
            import path from "node:path"
            const root = path.join(process.cwd(), "node_modules", "pi-litellm-provider")
            const manifest = JSON.parse(readFileSync(path.join(root, "package.json"), "utf8"))
            const entries = manifest.pi?.extensions ?? []
            if (entries.length === 0) throw new Error("tagged Git package has no pi.extensions")
            for (const entry of entries) {
              if (!existsSync(path.join(root, entry))) {
                throw new Error(`tagged Git package is missing ${entry}`)
              }
            }
            console.log(`tagged Git package ok: ${entries.join(", ")}`)
          '

      - name: Pack release artifacts
        id: pack
        shell: bash
        run: |
          mkdir release
          tarball="$(npm pack --pack-destination release)"
          checksum="$tarball.sha256"
          (cd release && sha256sum "$tarball" > "$checksum")
          echo "tarball=release/$tarball" >> "$GITHUB_OUTPUT"
          echo "checksum=release/$checksum" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          body: |
            Install the latest stable branch:
            `pi install git:github.com/rpchen/pi-litellm-provider`

            Install this fixed version:
            `pi install git:github.com/rpchen/pi-litellm-provider#${{ github.ref_name }}`
          files: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.checksum }}
