name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The OpenSpec closure gate derives requirement chronology from Git
          # introduction commits. A shallow clone cannot prove ancestry for
          # historical archives.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: npm ci

      - name: Verify committed distributable artifact
        run: bun run verify:dist

      - name: Typecheck
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Validate OpenSpec
        run: npm run validate:spec

      - name: Reject completed active OpenSpec changes
        run: npm run test:openspec-closure

      - name: Verify release metadata consistency
        run: npm run test:release-metadata

      - name: Test package without lifecycle scripts
        run: bun run test:package

      - name: Test remote Git package
        if: github.event_name == 'push'
        shell: bash
        env:
          PACKAGE_SPEC: github:${{ github.repository }}#${{ github.sha }}
        run: |
          consumer="$(mktemp -d)"
          trap 'rm -rf "$consumer"' EXIT
          cd "$consumer"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false "$PACKAGE_SPEC"
          node --input-type=module --eval '
            import { existsSync, readFileSync } from "node:fs"
            import path from "node:path"
            const root = path.join(process.cwd(), "node_modules", "pi-litellm-provider")
            const manifest = JSON.parse(readFileSync(path.join(root, "package.json"), "utf8"))
            const entries = manifest.pi?.extensions ?? []
            if (entries.length === 0) throw new Error("remote Git package has no pi.extensions")
            for (const entry of entries) {
              if (!existsSync(path.join(root, entry))) {
                throw new Error(`remote Git package is missing ${entry}`)
              }
            }
            console.log(`remote Git package ok: ${entries.join(", ")}`)
          '


  real-pi-host:
    name: Real Pi 0.87.1 E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0

      - name: Install real Pi host
        run: npm install --global @earendil-works/pi-coding-agent@0.87.1

      - name: Verify real host version
        run: pi --version

      - name: Run real host E2E against immutable Git candidate
        env:
          E2E_PI_VERSION: "0.87.1"
          E2E_PACKAGE_SPEC: git:github.com/${{ github.event.pull_request.head.repo.full_name || github.repository }}@${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run test:e2e:pi
