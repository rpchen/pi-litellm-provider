name: Diagnostics UX archive and dist sync

on:
  push:
    branches: [fix/diagnostics-local-time-and-archive]

permissions:
  contents: write

jobs:
  maintain:
    if: "!startsWith(github.event.head_commit.message, 'build: archive specs and sync diagnostics dist')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/diagnostics-local-time-and-archive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: npm ci
      - name: Archive completed changes in implementation order
        run: |
          npx openspec archive pr4-cross-repo-verification --yes
          npx openspec archive pr5-refresh-coordinator --yes
          npx openspec archive pr6-persisted-snapshot --yes
          npx openspec archive pr7-diagnostics --yes
          npx openspec archive pr8-discovery-quality-integration --yes
          npx openspec archive diagnostics-host-local-time --yes
      - name: Fill canonical spec purposes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const purposes = {
            "core-compatibility": "Defines how the Pi plugin validates an immutable litellm-discovery-core commit through its compatibility workflow, including SHA selection, complete consumer checks, and provenance evidence for cross-repository changes.",
            "refresh-coordinator": "Defines how Pi consumes the shared refresh coordinator while preserving Pi-owned credentials, persistence, refresh lifecycle, failure classification, host publication, and last-known-good behavior.",
            "discovery-snapshot": "Defines how Pi persists, restores, validates, and republishes endpoint-bound discovery snapshots while preserving Core compatibility rules and Pi-specific credential-less restore behavior.",
            "provider-diagnostics": "Defines Pi user-facing LiteLLM diagnostics, including discovery status, cache source and freshness, models.dev and protocol summaries, safe failure reporting, and the zero-model-turn command path.",
            "discovery-quality-integration": "Defines how Pi preserves discovery-quality semantics selected by Core, especially token-limit metadata, while mapping neutral ModelSpec values into Pi provider model configuration without adding host-specific heuristics.",
            "diagnostics": "Defines Pi diagnostics presentation requirements for host-local absolute timestamps while preserving the underlying UTC or epoch discovery state and using a stable explicit UTC offset in user-visible output."
          }
          for (const [name, purpose] of Object.entries(purposes)) {
            const path = `openspec/specs/${name}/spec.md`
            let content = fs.readFileSync(path, "utf8")
            content = content.replace(/## Purpose\n[\s\S]*?\n## Requirements/, `## Purpose\n${purpose}\n\n## Requirements`)
            fs.writeFileSync(path, content)
          }
          NODE
      - name: Build committed distribution
        run: bun run build:dist
      - name: Verify implementation and archive
        run: |
          bun run verify:dist
          bun run typecheck
          bun test
          bun run test:package
          npm run validate:spec
      - name: Commit generated distribution and archives
        run: |
          git add dist openspec
          git diff --cached --exit-code && exit 0 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: archive specs and sync diagnostics dist"
          git push origin HEAD:fix/diagnostics-local-time-and-archive
