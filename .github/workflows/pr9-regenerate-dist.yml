name: PR9 regenerate dist
on:
  push:
    branches: [feat/pr9-multi-endpoint-activation]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/pr9-multi-endpoint-activation
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10
      - run: npm ci
      - run: bun scripts/build.ts --sha=f2bb196350c6f8db406bfaff3321c2358fa04ed4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet && exit 0
          git commit -m "build(pi): refresh PR9 distribution"
          git push
